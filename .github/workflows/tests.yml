# Les tests tournent a chaque poussee, sur toutes les branches.
# Ils ne touchent ni au reseau ni a TMDB : aucun secret n'est necessaire, et
# MKVToolNix / FFmpeg ne sont pas installes ici - les appels aux outils externes
# sont simules.
name: Tests

# Sur toutes les branches, pas seulement main : le retour arrive au moment de la
# poussee, pas au moment de l'ouverture de la PR. Une seule execution par
# poussee - ajouter pull_request en doublerait le nombre, factures sur un depot prive.
on: push

jobs:
  unittest:
    # Le depot vise Windows, mais rien dans les tests ne devrait en dependre :
    # les deux systemes sont couverts pour que ca reste vrai.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # Le minimum annonce - celui que DSM (Synology) fournit, pour la fiche des films en tache planifiee -, et les deux dernieres versions.
        python: ["3.8", "3.14", "3.15"]
        # ubuntu-latest est passe a Ubuntu 26.04, pour lequel setup-python n'a pas de 3.8 :
        # la 3.8 tourne sur la derniere Ubuntu qui en a une (24.04).
        exclude:
          - os: ubuntu-latest
            python: "3.8"
        include:
          - os: ubuntu-24.04
            python: "3.8"

    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Tests
        run: python -m unittest discover -s tests -t . -v
